<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- PHOTO SLOT. Shopify: {{ image | image_url: width: 1600 }} with srcset 400/800/1200/1600 and sizes="(min-width: 990px) 50vw, 100vw" -->
<img src="{{ src }}" width="{{ w }}" height="{{ h }}" alt="{{ alt }}" loading="{{ loading }}" decoding="async" style="{{ imgS }}"></img>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:400},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:800,&quot;tsType&quot;:&quot;number&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:800,&quot;tsType&quot;:&quot;number&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Photo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;radius&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, w = +(p.w || 800), h = +(p.h || 800), label = String(p.label || 'PHOTO'), fill = p.fill === true || p.fill === 'true';
    const fs = Math.max(8, Math.min(w / 34, (w * 0.86) / (label.length * 0.7)));
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const dims = (p.nodims === true || p.nodims === 'true') ? '' : `<text x="50%" y="${h / 2 + fs * 1.3}" font-family="Helvetica,Arial,sans-serif" font-size="${fs * 0.85}" fill="#8A7A62" text-anchor="middle">${w}x${h}</text>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="#E9E1CF"/><text x="50%" y="${h / 2 - fs * 0.1}" font-family="Helvetica,Arial,sans-serif" font-size="${fs}" font-weight="700" letter-spacing="${fs * 0.06}" fill="#6B5B45" text-anchor="middle">${esc(label.toUpperCase())}</text>${dims}</svg>`;
    return {
      src: 'data:image/svg+xml;utf8,' + encodeURIComponent(svg), w, h, alt: p.alt || label,
      loading: (p.eager === true || p.eager === 'true') ? 'eager' : 'lazy',
      imgS: fill ? `position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;border-radius:${p.radius || '0'};` : `display:block;width:100%;height:auto;aspect-ratio:${w}/${h};object-fit:cover;border-radius:${p.radius || '0'};`
    };
  }
}
</script>
</body>
</html>
