<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- PLACEHOLDER JAR (CSS-built). Replace with product image: {{ product.featured_image }} -->
<div style="{{ root }}">
  <sc-if value="{{ isGift }}" hint-placeholder-val="{{ false }}">
    <div style="{{ giftLid }}"></div>
    <div style="{{ giftBody }}"><div style="{{ ribbon }}"></div><div style="{{ giftTag }}">{{ label }}</div></div>
  </sc-if>
  <sc-if value="{{ isJar }}" hint-placeholder-val="{{ true }}">
    <div style="{{ lid }}"></div>
    <div style="{{ neck }}"></div>
    <div style="{{ body }}">
      <div style="{{ shine }}"></div>
      <div style="{{ labelBox }}">
        <div style="{{ brand }}">GRAMEEN</div>
        <div style="{{ name }}">{{ label }}</div>
        <div style="{{ swoosh }}"></div>
        <div style="{{ subS }}">{{ sub }}</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:260},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ghee&quot;,&quot;pickle&quot;,&quot;gift&quot;],&quot;default&quot;:&quot;ghee&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bilona Ghee&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;500 ml&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:160,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, w = +(p.size || 160), h = w * 1.3, k = p.kind || 'ghee', gift = k === 'gift';
    const ghee = k === 'ghee';
    const fill = ghee ? 'linear-gradient(100deg,#D6951F 0%,#F2C24B 45%,#E3A82B 70%,#C98716 100%)' : 'linear-gradient(100deg,#8E2412 0%,#B3321E 45%,#A22B19 70%,#7A1F10 100%)';
    const lidc = ghee ? 'linear-gradient(90deg,#8A5F10,#C99A3A,#8A5F10)' : 'linear-gradient(90deg,#2B1D10,#4A3420,#2B1D10)';
    return {
      label: p.label || '', sub: p.sub || '', isGift: gift, isJar: !gift,
      root: `display:flex;flex-direction:column;align-items:center;width:${w}px;height:${h}px;filter:drop-shadow(0 ${w*.08}px ${w*.1}px rgba(43,29,16,.25));`,
      lid: `width:${w*.62}px;height:${h*.12}px;border-radius:${w*.05}px ${w*.05}px 3px 3px;background:${lidc};`,
      neck: `width:${w*.72}px;height:${h*.035}px;background:rgba(253,249,232,.6);`,
      body: `position:relative;width:${w}px;flex:1;border-radius:${w*.14}px ${w*.14}px ${w*.2}px ${w*.2}px;background:${fill};box-shadow:inset ${w*.04}px 0 ${w*.08}px rgba(255,255,255,.35),inset -${w*.05}px 0 ${w*.08}px rgba(43,29,16,.3);overflow:hidden;`,
      shine: `position:absolute;left:7%;top:8%;width:7%;height:80%;border-radius:99px;background:rgba(255,255,255,.4);`,
      labelBox: `position:absolute;left:12%;right:12%;top:26%;bottom:16%;background:#FDF9E8;border-radius:${w*.05}px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${w*.015}px;padding:${w*.03}px;text-align:center;box-shadow:0 1px 0 rgba(43,29,16,.2);`,
      brand: `font:700 ${Math.max(w*.05,7)}px/1 Figtree,sans-serif;letter-spacing:.2em;color:#2F5A1A;`,
      name: `font:600 ${w*.088}px/1.05 Fraunces,serif;color:#2B1D10;font-variation-settings:'SOFT' 100;`,
      swoosh: `width:55%;height:${Math.max(w*.02,2)}px;border-radius:99px;background:#B07D1F;`,
      subS: `font:600 ${Math.max(w*.048,7)}px/1 Figtree,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#7E5710;`,
      giftLid: `width:${w*1.04}px;height:${h*.18}px;background:linear-gradient(#3C6A22,#2F5A1A);border-radius:6px;position:relative;z-index:1;`,
      giftBody: `position:relative;width:${w}px;flex:1;background:linear-gradient(#C7A06A,#B58A52);border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:center;`,
      ribbon: `position:absolute;left:44%;width:12%;top:-${h*.18}px;bottom:0;background:#E3A82B;`,
      giftTag: `position:relative;background:#FDF9E8;color:#2B1D10;font:600 ${w*.085}px/1.1 Fraunces,serif;padding:${w*.04}px ${w*.07}px;border-radius:4px;text-align:center;max-width:70%;`
    };
  }
}
</script>
</body>
</html>
